[project]
name = "arch-backend"
version = "0.1.0"
description = "FastAPI backend for the ARCH Rock Climbing Hanoi platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.30",
  "alembic>=1.13.2",
  "pydantic>=2.7.4",
  "pydantic-settings>=2.3.3",
  "email-validator>=2.2.0",
  "pyjwt>=2.8.0",
  "bcrypt>=4.1.3",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "psycopg[binary]>=3.2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Alembic revisions are generated files; long lines there are not hand-written.
"migrations/versions/*" = ["E501"]
"migrations/env.py" = ["I001"]
